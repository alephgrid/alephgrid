name: Scheduled

# Longer randomized runs and repeated integration suites (docs/TEST_STRATEGY.md, "Scheduled").

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  long-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: web
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - uses: Swatinem/rust-cache@v2
      - name: Property and state-machine tests, 2000 cases
        run: cargo test -p rowfinity-engine --lib props
        env:
          PROPTEST_CASES: "2000"
      - name: Integration and crash suites, repeated to surface flakiness
        run: for i in 1 2 3 4 5; do cargo test -p rowfinity-server || exit 1; done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: proptest-regressions
          path: crates/rowfinity-engine/proptest-regressions
