[package]
name = "alephgrid-server"
description = "Self-hostable server for Alephgrid, the open-source big-data spreadsheet"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "alephgrid"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
alephgrid-core = { path = "../alephgrid-core" }
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
mime_guess = "2"
rust-embed = "8"
sha2 = "0.10"
thiserror.workspace = true
duckdb.workspace = true
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
