# CircleCI never runs on a push (docs/CI.md, owner decision 9.16). Pushes and pull requests start
# a pipeline whose parameters are all false, so no workflow runs and nothing is billed. The test
# tiers of docs/TEST_STRATEGY.md:
#
#   pr       run_check = true (tools/ci.sh check): build, Rust tests, clippy, licence notices,
#            the test gate, browser journeys in Chromium
#   nightly  run_nightly = true (tools/ci.sh nightly), or a CircleCI schedule (set up once by the
#            owner, docs/CI.md): the PR tier plus Firefox and WebKit, the install check, long
#            property and fuzz runs, repeated server suites and mutation testing
#   release  run_release = true, release_version = X.Y.Z, on tag vX.Y.Z (tools/ci.sh release
#            vX.Y.Z): everything in nightly, then build, smoke-test and package every platform,
#            check the artifacts, make a private draft GitHub release, wait for approval in
#            CircleCI, then publish (docs/RELEASING.md)
#
# A failing test fails its job in every tier: no retries, no "|| true" (tools/test_gate.py checks).

version: 2.1

parameters:
  run_check:
    type: boolean
    default: false
  run_nightly:
    type: boolean
    default: false
  # The earlier name of run_nightly; still accepted.
  run_full:
    type: boolean
    default: false
  run_release:
    type: boolean
    default: false
  release_version:
    type: string
    default: ""

executors:
  node:
    docker:
      - image: cimg/node:22.12
    resource_class: medium
  # A full VM: the disk-full tests mount a tmpfs, and Python functions need bubblewrap,
  # neither of which works inside a container.
  vm:
    machine:
      image: ubuntu-2404:current
    resource_class: large

commands:
  rust-setup:
    steps:
      - run:
          name: Install Rust (version from rust-toolchain.toml)
          command: |
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo 'source "$HOME/.cargo/env"' >> "$BASH_ENV"
            source "$HOME/.cargo/env"
            rustup toolchain install   # reads rust-toolchain.toml; a no-op once installed
            rustc --version
      - restore_cache:
          keys:
            - v1-cargo-{{ arch }}-{{ checksum "rust-toolchain.toml" }}-{{ checksum "Cargo.lock" }}
            - v1-cargo-{{ arch }}-{{ checksum "rust-toolchain.toml" }}-
  rust-save:
    steps:
      - save_cache:
          key: v1-cargo-{{ arch }}-{{ checksum "rust-toolchain.toml" }}-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - target
  python-sandbox:
    steps:
      - run:
          name: Python and its sandbox (bubblewrap) for the Python function tests
          command: |
            sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap python3-venv
            # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor; bwrap needs them.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
            bwrap --ro-bind / / true && echo "bwrap works"
  node-setup:
    steps:
      - run:
          name: Node 22 (pinned, from nodejs.org)
          command: |
            v=22.12.0
            case "$(uname -m)" in x86_64) a=x64 ;; aarch64) a=arm64 ;; esac
            curl -fsSL "https://nodejs.org/dist/v$v/node-v$v-linux-$a.tar.xz" | tar -xJ -C "$HOME"
            echo "export PATH=\"$HOME/node-v$v-linux-$a/bin:\$PATH\"" >> "$BASH_ENV"
            source "$BASH_ENV"
            node --version && npm --version

jobs:
  web:
    executor: node
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-npm-{{ checksum "web/package-lock.json" }}
      - run:
          name: Install
          working_directory: web
          command: npm ci
          environment:
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - save_cache:
          key: v1-npm-{{ checksum "web/package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Type check and bundle
          working_directory: web
          command: npm run build
      - persist_to_workspace:
          root: .
          paths:
            - web/dist

  # Compiles everything once: the server binary for the browser tests, and the test and clippy
  # artifacts kept in the cargo cache for the jobs that follow.
  rust-build:
    executor: vm
    environment:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TERM_COLOR: always
    steps:
      - checkout
      - attach_workspace:
          at: .
      - rust-setup
      - run:
          name: Server binary and the tests (DuckDB compiles here on a cold cache)
          command: |
            cargo build -p alephgrid-server --locked
            cargo test --workspace --locked --no-run
          no_output_timeout: 40m
      - rust-save
      - persist_to_workspace:
          root: .
          paths:
            - target/debug/alephgrid

  rust-test:
    executor: vm
    environment:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TERM_COLOR: always
    steps:
      - checkout
      - attach_workspace:
          at: .
      - rust-setup
      - python-sandbox
      - run:
          name: A small filesystem for the disk-full tests (tests/storage_faults.rs)
          command: |
            sudo mkdir -p /mnt/rfsmall
            sudo mount -t tmpfs -o size=64m tmpfs /mnt/rfsmall
            sudo chown "$(id -u):$(id -g)" /mnt/rfsmall
      - run:
          name: Tests (includes the protocol drift check)
          command: cargo test --workspace --locked --no-fail-fast
          no_output_timeout: 40m
          environment:
            PROPTEST_CASES: "96"
            ALEPHGRID_SMALL_FS: /mnt/rfsmall

  clippy:
    executor: vm
    environment:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TERM_COLOR: always
    steps:
      - checkout
      - attach_workspace:
          at: .
      - rust-setup
      - run:
          name: Clippy
          command: cargo clippy --workspace --all-targets --locked -- -D warnings
          no_output_timeout: 40m
      - run:
          name: Licence notices match Cargo.lock and web/package-lock.json (tools/licenses.py)
          command: python3 tools/licenses.py --check
      - run:
          name: Test gate (skips listed with a reason, required suites present; tools/test_gate.py)
          command: python3 tools/test_gate.py

  e2e:
    executor: vm
    parameters:
      browser:
        type: enum
        enum: [chromium, firefox, webkit]
    steps:
      - checkout
      - attach_workspace:
          at: .
      - node-setup
      - run:
          name: Install the web dependencies and << parameters.browser >>
          working_directory: web
          command: |
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci
            npx playwright install --with-deps << parameters.browser >>
      - python-sandbox
      - run:
          name: Browser journeys (<< parameters.browser >>)
          working_directory: web
          command: |
            chmod +x ../target/debug/alephgrid
            npx playwright test --reporter=list,junit
          no_output_timeout: 30m
          environment:
            E2E_BROWSER: << parameters.browser >>
            # Playwright's own Chromium build instead of Google Chrome.
            E2E_BROWSER_CHANNEL: chromium
            PLAYWRIGHT_JUNIT_OUTPUT_NAME: e2e-results/junit.xml
      - store_test_results:
          path: web/e2e-results
      - store_artifacts:
          path: web/test-results
          destination: playwright-<< parameters.browser >>

  long-runs:
    executor: vm
    environment:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - checkout
      - attach_workspace:
          at: .
      - rust-setup
      - python-sandbox
      - run:
          name: Property and state-machine tests, 2000 cases
          command: cargo test --locked -p alephgrid-core --lib props
          no_output_timeout: 40m
          environment:
            PROPTEST_CASES: "2000"
      - run:
          name: Fuzz targets (formula parsers, CSV import, pasted cells), 200,000 cases or 5 minutes each
          command: cargo test --locked -p alephgrid-core --lib tests::fuzz -- --nocapture
          no_output_timeout: 40m
          environment:
            FUZZ_CASES: "200000"
            FUZZ_SECONDS: "300"
      - run:
          name: Integration and crash suites, five times to surface flakiness
          command: for i in 1 2 3 4 5; do cargo test --locked -p alephgrid-server || exit 1; done
          no_output_timeout: 40m
      # Shrunk failing inputs of the property and fuzz targets: commit them to replay them on
      # every later run (docs/TEST_STRATEGY.md).
      - store_artifacts:
          path: crates/alephgrid-core/proptest-regressions
          destination: proptest-regressions

  # The built binary starts on an empty data directory, serves the UI, creates a workbook and
  # imports a CSV: the release smoke test, on every nightly run.
  install-check:
    executor: vm
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install check (tools/release/smoke.sh)
          command: |
            chmod +x target/debug/alephgrid
            tools/release/smoke.sh target/debug/alephgrid "$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"

  # Disables one engine safeguard at a time; the engine tests must catch each (tools/mutants.py).
  mutation:
    executor: vm
    environment:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - checkout
      - attach_workspace:
          at: .
      - rust-setup
      - run:
          name: Targeted mutation testing (every mutant must be killed)
          command: python3 tools/mutants.py
          no_output_timeout: 40m

  # ------------------------------------------------------------------ release (docs/RELEASING.md)
  release-check:
    executor: node
    steps:
      - checkout
      - run:
          name: The version, the tag and the changelog agree
          command: |
            v="<< pipeline.parameters.release_version >>"
            cargo_v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
            [ "$v" = "$cargo_v" ] || { echo "release_version $v is not Cargo.toml's $cargo_v"; exit 1; }
            [ "${CIRCLE_TAG:-}" = "v$v" ] || { echo "run the release on tag v$v (this is '${CIRCLE_TAG:-no tag}')"; exit 1; }
            grep -q "^## $v" CHANGELOG.md || { echo "CHANGELOG.md has no '## $v' section"; exit 1; }

  release-linux:
    parameters:
      arch:
        type: enum
        enum: [amd64, arm64]
      triple:
        type: string
      resource:
        type: string
    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.resource >>
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Release build on Debian 11 (glibc 2.31, so it runs on older distributions too)
          no_output_timeout: 60m
          command: |
            docker run --rm -v "$PWD":/src -w /src -e CARGO_TERM_COLOR=always debian:bullseye bash -euc '
              apt-get update -qq && apt-get install -y -qq --no-install-recommends build-essential curl ca-certificates pkg-config >/dev/null
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
              . "$HOME/.cargo/env"
              rustup toolchain install
              cargo build --release --locked -p alephgrid-server'
            sudo chown -R "$(id -u):$(id -g)" target
            echo "needs glibc $(objdump -T target/release/alephgrid | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
      - run:
          name: Smoke test, then package
          command: |
            v="<< pipeline.parameters.release_version >>"
            tools/release/smoke.sh target/release/alephgrid "$v"
            tools/release/package.sh "$v" << parameters.triple >> target/release/alephgrid dist
            mkdir -p docker/<< parameters.arch >> && cp target/release/alephgrid docker/<< parameters.arch >>/alephgrid
      - persist_to_workspace:
          root: .
          paths:
            - dist/*-<< parameters.triple >>.tar.gz*
            - docker/<< parameters.arch >>/alephgrid

  release-macos:
    macos:
      xcode: "26.2.0"
    resource_class: m4pro.medium
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Release builds for Apple silicon and Intel
          no_output_timeout: 60m
          command: |
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            source "$HOME/.cargo/env"
            rustup toolchain install
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
            export MACOSX_DEPLOYMENT_TARGET=11.0
            for t in aarch64-apple-darwin x86_64-apple-darwin; do cargo build --release --locked -p alephgrid-server --target "$t"; done
      - run:
          name: Smoke test (Apple silicon), then package both
          command: |
            v="<< pipeline.parameters.release_version >>"
            tools/release/smoke.sh target/aarch64-apple-darwin/release/alephgrid "$v"
            tools/release/package.sh "$v" aarch64-apple-darwin target/aarch64-apple-darwin/release/alephgrid dist
            CROSS=1 tools/release/package.sh "$v" x86_64-apple-darwin target/x86_64-apple-darwin/release/alephgrid dist
      - persist_to_workspace:
          root: .
          paths:
            - dist/*-apple-darwin.tar.gz*

  # Software bills of materials (CycloneDX JSON), uploaded next to the archives and listed in
  # SHA256SUMS: one per release target for the Rust dependencies linked into that binary, and
  # one for the web bundle's production npm dependencies. The C/C++ libraries bundled in DuckDB
  # are not in cargo's graph; they are listed in THIRD-PARTY-NOTICES.md. Signatures for the
  # archives and SBOMs are not produced yet (9.11).
  release-sbom:
    executor: vm
    steps:
      - checkout
      - rust-setup
      - node-setup
      - run:
          name: CycloneDX SBOMs (cargo-cyclonedx 0.5.9, npm sbom)
          command: |
            v="<< pipeline.parameters.release_version >>"
            # Pinned and installed from the lock file it was published with; update deliberately.
            cargo install cargo-cyclonedx --version 0.5.9 --locked
            export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
            mkdir -p dist
            for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin; do
              cargo cyclonedx --manifest-path Cargo.toml --format json --spec-version 1.5 --all \
                --no-build-deps --target "$t" --override-filename sbom
              mv crates/alephgrid-server/sbom.json "dist/alephgrid-$v-$t.cdx.json"
            done
            (cd web && npm sbom --sbom-format cyclonedx --omit dev --package-lock-only) > "dist/alephgrid-$v-web.cdx.json"
            cd dist
            for f in *.cdx.json; do sha256sum "$f" > "$f.sha256"; done
            ls -l
      - persist_to_workspace:
          root: .
          paths:
            - dist/*.cdx.json*

  # The artifacts match the tagged source before anything is drafted (tools/release/verify.sh).
  release-verify:
    executor: node
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Archives, SBOMs, checksums, notices and the reported version
          command: tools/release/verify.sh "<< pipeline.parameters.release_version >>" dist

  release-draft:
    executor: node
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Private draft GitHub release with every archive, SBOM and the checksums
          command: |
            cat dist/*.sha256 > dist/SHA256SUMS
            tools/release/github.sh draft "<< pipeline.parameters.release_version >>" dist

  release-publish-github:
    executor: node
    steps:
      - checkout
      - run: tools/release/github.sh publish "<< pipeline.parameters.release_version >>"

  release-docker:
    executor: vm
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Multi-architecture image from the tested binaries, to ghcr.io
          command: |
            v="<< pipeline.parameters.release_version >>"
            # Third-party images run here by digest, never by a tag someone can move, and
            # before the registry token is handed to docker. Update the digests deliberately
            # (docs/CI.md, "Release safety").
            docker run --privileged --rm tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64
            docker buildx create --use --name release --driver-opt image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
            cp LICENSE NOTICE THIRD-PARTY-NOTICES.md docker/
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${GITHUB_USER:?set GITHUB_USER in the release context}" --password-stdin
            docker buildx build -f Dockerfile.release --platform linux/amd64,linux/arm64 \
              --label org.opencontainers.image.source=https://github.com/alephgrid/alephgrid \
              --label org.opencontainers.image.version="$v" --label org.opencontainers.image.licenses=Apache-2.0 \
              -t ghcr.io/alephgrid/alephgrid:"$v" -t ghcr.io/alephgrid/alephgrid:latest --push docker

  release-npm:
    executor: node
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: npm packages (platform packages first), skipping only our own earlier publish
          command: |
            v="<< pipeline.parameters.release_version >>"
            node tools/release/npm.mjs "$v" dist npm-out
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN:?set NPM_TOKEN in the release context}" > ~/.npmrc
            for d in npm-out/cli-* npm-out/alephgrid; do
              name=$(node -p "require('./$d/package.json').name")
              # A version already on npm is skipped only if it is exactly this package (a
              # re-run). Anything else under that name and version (someone else's upload)
              # stops the release before the main package can depend on it.
              published=$(npm view "$name@$v" dist.integrity 2>/dev/null || true)
              if [ -n "$published" ]; then
                local=$(cd "$d" && npm pack --dry-run --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].integrity))')
                if [ "$published" = "$local" ]; then echo "$name@$v is already published (same contents)"; continue; fi
                echo "$name@$v is on npm with other contents ($published, this build is $local): not publishing on top of it" >&2
                exit 1
              fi
              (cd "$d" && npm publish --access public)
            done

workflows:
  pr:
    when:
      and:
        - << pipeline.parameters.run_check >>
        - not: << pipeline.parameters.run_nightly >>
        - not: << pipeline.parameters.run_full >>
        - not:
            equal: [scheduled_pipeline, << pipeline.trigger_source >>]
    jobs:
      - web
      - rust-build:
          requires: [web]
      - rust-test:
          requires: [rust-build]
      - clippy:
          requires: [rust-build]
      - e2e:
          name: e2e-chromium
          browser: chromium
          requires: [rust-build]

  # Started by a CircleCI schedule (set run_nightly = true in it; docs/CI.md) or by hand.
  nightly:
    when:
      or:
        - << pipeline.parameters.run_nightly >>
        - << pipeline.parameters.run_full >>
        - equal: [scheduled_pipeline, << pipeline.trigger_source >>]
    jobs:
      - web
      - rust-build:
          requires: [web]
      - rust-test:
          requires: [rust-build]
      - clippy:
          requires: [rust-build]
      - e2e:
          name: e2e-<< matrix.browser >>
          matrix:
            parameters:
              browser: [chromium, firefox, webkit]
          requires: [rust-build]
      - install-check:
          requires: [rust-build]
      - long-runs:
          requires: [rust-build]
      - mutation:
          requires: [rust-build]

  # On a tag only, started by tools/ci.sh release vX.Y.Z. Every nightly check runs on the tagged
  # commit first; nothing is public until someone approves the "approve-publish" step in
  # CircleCI after checking the draft release.
  release:
    when: << pipeline.parameters.run_release >>
    jobs:
      - release-check:
          filters: &on-tags
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - web:
          filters: *on-tags
      - rust-build:
          requires: [web]
          filters: *on-tags
      - rust-test:
          requires: [rust-build]
          filters: *on-tags
      - clippy:
          requires: [rust-build]
          filters: *on-tags
      - e2e:
          name: e2e-<< matrix.browser >>
          matrix:
            parameters:
              browser: [chromium, firefox, webkit]
          requires: [rust-build]
          filters: *on-tags
      - install-check:
          requires: [rust-build]
          filters: *on-tags
      - long-runs:
          requires: [rust-build]
          filters: *on-tags
      - mutation:
          requires: [rust-build]
          filters: *on-tags
      - release-linux:
          name: release-linux-amd64
          arch: amd64
          triple: x86_64-unknown-linux-gnu
          resource: large
          requires: [release-check, web]
          filters: *on-tags
      - release-linux:
          name: release-linux-arm64
          arch: arm64
          triple: aarch64-unknown-linux-gnu
          resource: arm.large
          requires: [release-check, web]
          filters: *on-tags
      - release-macos:
          requires: [release-check, web]
          filters: *on-tags
      - release-sbom:
          requires: [release-check]
          filters: *on-tags
      - release-verify:
          requires: [release-linux-amd64, release-linux-arm64, release-macos, release-sbom]
          filters: *on-tags
      - release-draft:
          context: release
          requires:
            - release-verify
            - rust-test
            - clippy
            - e2e-chromium
            - e2e-firefox
            - e2e-webkit
            - install-check
            - long-runs
            - mutation
          filters: *on-tags
      - approve-publish:
          type: approval
          requires: [release-draft]
          filters: *on-tags
      - release-publish-github:
          context: release
          requires: [approve-publish]
          filters: *on-tags
      - release-docker:
          context: release
          requires: [approve-publish]
          filters: *on-tags
      - release-npm:
          context: release
          requires: [approve-publish]
          filters: *on-tags
