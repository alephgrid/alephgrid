# Builds the image from this checkout: docker compose up -d; the log shows the one-time setup
# code for http://localhost:7878/setup. Ready-made setups with the published image:
# deploy/localhost (one person, loopback only) and deploy/team (accounts, HTTPS through Caddy).
services:
  alephgrid:
    build: .
    image: alephgrid:latest
    restart: unless-stopped
    ports:
      - "7878:7878"
    environment:
      ALEPHGRID_AUTH: accounts            # people sign in; the first start logs a one-time setup code
      # ALEPHGRID_PUBLIC_URL: https://grid.example.com   # how people reach it (needed for SSO)
      # ALEPHGRID_OIDC_ISSUER: https://login.example.com  # single sign-on (see docs/TEAMS.md)
      # ALEPHGRID_OIDC_CLIENT_ID: alephgrid
      # ALEPHGRID_OIDC_CLIENT_SECRET: ...
      ALEPHGRID_MEMORY_BUDGET: 4GB        # DuckDB memory budget; spills to disk beyond it
      # ALEPHGRID_DISABLE_SQL: "true"     # turn off the SQL console for untrusted users
    volumes:
      - alephgrid-data:/data
volumes:
  alephgrid-data:
