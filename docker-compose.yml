# docker compose up -d   →   http://localhost:7878/?token=change-me
services:
  alephgrid:
    build: .
    image: alephgrid:latest
    restart: unless-stopped
    ports:
      - "7878:7878"
    environment:
      ALEPHGRID_TOKEN: change-me          # shared access token; set something long and random
      ALEPHGRID_MEMORY_LIMIT: 4GB         # DuckDB memory budget; spills to disk beyond it
      # ALEPHGRID_DISABLE_SQL: "true"     # turn off the SQL console for untrusted users
    volumes:
      - alephgrid-data:/data
volumes:
  alephgrid-data:
