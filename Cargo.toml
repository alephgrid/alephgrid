[workspace]
resolver = "2"
members = ["crates/rowfinity-engine", "crates/rowfinity-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
duckdb = { version = "1.20000.0", features = ["bundled", "parquet", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# DuckDB is a large C++ build; skip debug info for it so dev builds stay small and fast.
[profile.dev.package.libduckdb-sys]
opt-level = 1
debug = false
